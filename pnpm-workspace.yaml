packages:
  - apps/*
  - packages/*

# Packages whose install scripts may run. esbuild ships its binary through optional
# platform packages, so its install script is not needed.
allowBuilds:
  esbuild: false
  vue-demi: false

ignoredOptionalDependencies:
  - "@napi-rs/canvas"

minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.11.10"
  - "@turbo/darwin-arm64@2.11.10"
  - "@turbo/linux-64@2.11.10"
  - "@turbo/linux-arm64@2.11.10"
  - "@turbo/windows-64@2.11.10"
  - "@turbo/windows-arm64@2.11.10"
  - happy-dom@21.0.4
  - i18next@26.5.4
  - turbo@2.11.10

overrides:
  fractional-indexing: link:./packages/fractional-indexing
  "@excalidraw/excalidraw>nanoid": ^3.3.12
  "@excalidraw/mermaid-to-excalidraw>nanoid": ^5.1.11
  "@excalidraw/excalidraw>sass": "-"
  lodash-es: ^4.18.1

patchedDependencies:
  "@tiptap/y-tiptap@3.0.9": patches/@tiptap__y-tiptap@3.0.9.patch
