version: 2

multi-ecosystem-groups:
  minor-and-patch:
    schedule:
      interval: monthly
    labels: []
    commit-message:
      prefix: build
      include: scope
  major:
    schedule:
      interval: monthly
    labels: []
    commit-message:
      prefix: build
      include: scope

updates:
  - package-ecosystem: npm
    directory: /
    patterns: ["*"]
    update-types: [minor, patch]
    multi-ecosystem-group: minor-and-patch
    labels: []
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    update-types: [minor, patch]
    multi-ecosystem-group: minor-and-patch
    labels: []

  - package-ecosystem: docker
    directory: /docker
    patterns: ["*"]
    update-types: [minor, patch]
    multi-ecosystem-group: minor-and-patch
    labels: []
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: docker-compose
    directory: /docker
    patterns: ["*"]
    update-types: [minor, patch]
    multi-ecosystem-group: minor-and-patch
    labels: []
    ignore:
      - dependency-name: postgres
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /
    patterns: ["*"]
    update-types: [major]
    multi-ecosystem-group: major
    labels: []
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    update-types: [major]
    multi-ecosystem-group: major
    labels: []

  - package-ecosystem: docker
    directory: /docker
    patterns: ["*"]
    update-types: [major]
    multi-ecosystem-group: major
    labels: []
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: docker-compose
    directory: /docker
    patterns: ["*"]
    update-types: [major]
    multi-ecosystem-group: major
    labels: []
    ignore:
      - dependency-name: postgres
        update-types: [version-update:semver-major]
