name: Bug report
description: Report something that does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Follow SECURITY.md instead.
        Questions are answered in GitHub Discussions.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Pagehall version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, deployment (single node or several nodes), PostgreSQL version.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines. Remove secrets and personal data before posting.
      render: text
