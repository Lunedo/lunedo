name: API compatibility

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  breaking-changes:
    name: Breaking API changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Compare the API description with the base branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ALLOW_BREAKING: ${{ contains(github.event.pull_request.labels.*.name, 'breaking-api-change') }}
        run: |
          if [ "$ALLOW_BREAKING" = "true" ]; then
            node scripts/check-api-compatibility.ts "$BASE_SHA" --allow-breaking
          else
            node scripts/check-api-compatibility.ts "$BASE_SHA"
          fi
