name: Audit

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '"ubuntu-24.04"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - name: Audit all dependencies
        run: |
          status=0
          pnpm audit > audit.txt 2>&1 || status=$?
          cat audit.txt
          {
            echo '## Dependency audit'
            echo '```'
            cat audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::error title=Dependency audit::pnpm audit found known vulnerabilities. See the job summary."
          fi
          exit "$status"
      - name: Compare the pinned SheetJS release
        if: ${{ !cancelled() }}
        run: node scripts/check-sheetjs.ts
