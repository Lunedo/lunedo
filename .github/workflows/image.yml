name: Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/pagehall/pagehall
  RENDER_IMAGE: ghcr.io/pagehall/render

jobs:
  build:
    name: Build image
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '"ubuntu-24.04"') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: false
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image

  render:
    name: Build render image
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '"ubuntu-24.04"') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/render.Dockerfile
          platforms: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: false
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha,scope=render-image
          cache-to: type=gha,mode=max,scope=render-image

  publish:
    name: Publish ${{ matrix.name }}
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '"ubuntu-24.04"') }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: image
            file: docker/Dockerfile
            variable: IMAGE
            scope: image
          - name: render image
            file: docker/render.Dockerfile
            variable: RENDER_IMAGE
            scope: render-image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Derive the tags from the release tag
        id: tags
        env:
          REPOSITORY: ${{ env[matrix.variable] }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::The tag $TAG is not a release version like v1.4.2."
            exit 1
          fi
          minor="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          {
            echo "version=$version"
            echo "tags<<EOF"
            echo "$REPOSITORY:$version"
            echo "$REPOSITORY:$minor"
            echo "$REPOSITORY:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VERSION=${{ steps.tags.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.scope }}

  version-file:
    name: Attach the version file to the release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read the release notes from the published image
        env:
          TAG: ${{ github.ref_name }}
        run: |
          previous="$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || echo v0.0.0)"
          docker run --rm "$IMAGE:${TAG#v}" release-notes --json > pagehall-versions.json
          docker run --rm "$IMAGE:${TAG#v}" release-notes --since "${previous#v}" > release-notes.txt
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Pagehall ${TAG#v}" --notes-file release-notes.txt
          fi
          gh release upload "$TAG" pagehall-versions.json scripts/install.sh --repo "$GITHUB_REPOSITORY" --clobber
