name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'schedule' && '-stress' || '' }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"
  CI_RETRIES: ${{ github.event_name == 'schedule' && '0' || '1' }}
  CI_PARALLELISM: ${{ vars.CI_PARALLELISM }}
  TURBO_CONCURRENCY: ${{ vars.CI_PARALLELISM || '10' }}
  GOMAXPROCS: ${{ vars.CI_PARALLELISM }}
  RAYON_NUM_THREADS: ${{ vars.CI_PARALLELISM }}
  CI_CACHE_DIR: ${{ vars.CI_CACHE_DIR || '/srv/ci-cache' }}

jobs:
  scope:
    name: Scope
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || !contains(vars.RUNNER_LABELS, 'self-hosted'))
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '"ubuntu-24.04"') }}
    timeout-minutes: 5
    outputs:
      lane: ${{ steps.scope.outputs.lane }}
      end-to-end: ${{ steps.scope.outputs.endToEnd }}
      sweeps: ${{ steps.scope.outputs.sweeps }}
      identity-providers: ${{ steps.scope.outputs.identityProviders }}
      backup: ${{ steps.scope.outputs.backup }}
      operations: ${{ steps.scope.outputs.operations }}
      base: ${{ steps.scope.outputs.base }}
      head: ${{ steps.scope.outputs.head }}
      runner-user: ${{ steps.runner.outputs.user }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: scope
        run: node scripts/check-ci-scope.ts
      - name: Record the user of the runner for the end-to-end container
        id: runner
        run: echo "user=$(id -u):$(id -g)" >> "$GITHUB_OUTPUT"

  browsers-first:
    name: Give the end-to-end tests a runner first
    needs: scope
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || !contains(vars.RUNNER_LABELS, 'self-hosted'))
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '"ubuntu-24.04"') }}
    timeout-minutes: 5
    steps:
      - run: echo "The end-to-end job is queued before the other jobs."

  checks:
    name: Lint, typecheck and checks
    needs: [scope, browsers-first]
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || !contains(vars.RUNNER_LABELS, 'self-hosted'))
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Use the caches on the runner
        if: ${{ contains(vars.RUNNER_LABELS, 'self-hosted') }}
        run: node scripts/prepare-ci-cache.ts host "$CI_CACHE_DIR"
      - run: corepack enable
      - name: Locate the pnpm store
        id: pnpm
        run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - if: ${{ !contains(vars.RUNNER_LABELS, 'self-hosted') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - if: ${{ !contains(vars.RUNNER_LABELS, 'self-hosted') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-checks-${{ github.sha }}
          restore-keys: turbo-checks-
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm references:check
      - run: pnpm patches:check
      - run: pnpm playwright-image:check
      - run: pnpm i18n:check
      - run: pnpm shell:check
      - run: pnpm release-jobs:check
      - run: pnpm container-users:check
      - run: pnpm typecheck
      - name: Script tests
        run: node --test "scripts/*.test.ts"

  unit:
    name: Unit tests (${{ matrix.shard }} of 3)
    needs: [scope, browsers-first]
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || !contains(vars.RUNNER_LABELS, 'self-hosted'))
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '"ubuntu-24.04"') }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pagehall
          POSTGRES_PASSWORD: pagehall
          POSTGRES_DB: pagehall
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U pagehall -d pagehall"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
          --tmpfs /var/lib/postgresql/data
      mailpit:
        image: axllent/mailpit:v1.31.3
        env:
          MP_DISABLE_VERSION_CHECK: "true"
          MP_DATABASE: "file::memory:"
        ports:
          - 1025
          - 8025
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      s3:
        image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
        env:
          AWS_ACCESS_KEY_ID: pagehall
          AWS_SECRET_ACCESS_KEY: pagehall-s3
        ports:
          - 8333
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8333/healthz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      LANE: ${{ needs.scope.outputs.lane }}
      FORCE: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
      SHARD: ${{ matrix.shard }}
      TURBO_SCM_BASE: ${{ needs.scope.outputs.base }}
      TURBO_SCM_HEAD: ${{ needs.scope.outputs.head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ needs.scope.outputs.lane == 'fast' && '0' || '1' }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Use the caches on the runner
        if: ${{ contains(vars.RUNNER_LABELS, 'self-hosted') }}
        run: node scripts/prepare-ci-cache.ts host "$CI_CACHE_DIR"
      - run: corepack enable
      - name: Locate the pnpm store
        id: pnpm
        run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - if: ${{ !contains(vars.RUNNER_LABELS, 'self-hosted') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - if: ${{ !contains(vars.RUNNER_LABELS, 'self-hosted') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-unit-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: turbo-unit-${{ matrix.shard }}-
      - name: Install PostgreSQL client tools for the backup tests
        run: command -v pg_dump > /dev/null || (sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client)
      - run: pnpm install --frozen-lockfile
      - name: Turn off durability in the test database
        run: node scripts/tune-test-postgres.ts "postgres://pagehall:pagehall@localhost:${{ job.services.postgres.ports['5432'] }}/pagehall"
      - name: Collect the test reports of this job
        run: |
          echo "PAGEHALL_TEST_REPORT_DIR=$GITHUB_WORKSPACE/.test-reports" >> "$GITHUB_ENV"
          echo "PAGEHALL_TEST_JOB=Unit tests (${{ matrix.shard }} of 3)" >> "$GITHUB_ENV"
      - name: Run the tests of this shard
        env:
          PAGEHALL_TEST_DATABASE_URL: postgres://pagehall:pagehall@localhost:${{ job.services.postgres.ports['5432'] }}/pagehall
          PAGEHALL_TEST_MAILPIT_URL: http://localhost:${{ job.services.mailpit.ports['8025'] }}
          PAGEHALL_TEST_MAILPIT_SMTP_PORT: ${{ job.services.mailpit.ports['1025'] }}
          PAGEHALL_TEST_REDIS_URL: redis://localhost:${{ job.services.valkey.ports['6379'] }}
          PAGEHALL_TEST_S3_ENDPOINT: http://localhost:${{ job.services.s3.ports['8333'] }}
        run: |
          args=(run test --continue)
          if [ "$LANE" = "fast" ]; then args+=(--affected); fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          pnpm exec turbo "${args[@]}" -- "--shard=${SHARD}/3" --passWithNoTests \n            --reporter=default "--reporter=${GITHUB_WORKSPACE}/packages/config/src/vitest-report.ts"
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-unit-${{ matrix.shard }}
          path: .test-reports
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  backup:
    name: Backup round trip
    needs: [scope, browsers-first]
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || !contains(vars.RUNNER_LABELS, 'self-hosted')) && needs.scope.outputs.backup == 'true'
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '"ubuntu-24.04"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: ${{ contains(vars.RUNNER_LABELS, 'self-hosted') && 'docker' || 'docker-container' }}
      - name: Build the image for amd64 with the local layer cache
        if: ${{ contains(vars.RUNNER_LABELS, 'self-hosted') }}
        timeout-minutes: 15
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: pagehall:ci-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: VERSION=ci
      - name: Build the image for amd64
        if: ${{ !contains(vars.RUNNER_LABELS, 'self-hosted') }}
        timeout-minutes: 15
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: pagehall:ci-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: VERSION=ci
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=image
          cache-to: type=gha,mode=max,scope=amd64
      - name: Back up, restore and compare
        run: scripts/backup-roundtrip.sh pagehall:ci-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Remove the image of this job
        if: always()
        run: docker image rm --force pagehall:ci-${{ github.run_id }}-${{ github.run_attempt }}

  operations:
    name: Installation, update and reverse proxies
    needs: [scope, browsers-first]
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || !contains(vars.RUNNER_LABELS, 'self-hosted')) && needs.scope.outputs.operations == 'true'
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '"ubuntu-24.04"') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find the previous version
        id: previous
        run: |
          release="$(git tag --list 'v*' --sort=-version:refname --merged HEAD | head -n 1)"
          if [ -n "$release" ]; then
            echo "Installing the previous release $release, then updating to the build under test."
            echo "image=ghcr.io/pagehall/pagehall:${release#v}" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            base="$(git merge-base HEAD origin/main)"
            if [ "$base" = "$(git rev-parse HEAD)" ]; then base="$(git rev-parse HEAD~1)"; fi
            echo "No release exists yet. Installing the image of $base, the commit before this change, then updating to the build under test."
            path="$RUNNER_TEMP/previous-${{ github.run_id }}-${{ github.run_attempt }}"
            git worktree prune
            rm -rf "$path"
            git worktree add --detach "$path" "$base"
            echo "path=$path" >> "$GITHUB_OUTPUT"
            echo "sha=$base" >> "$GITHUB_OUTPUT"
            echo "image=pagehall:previous-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: ${{ contains(vars.RUNNER_LABELS, 'self-hosted') && 'docker' || 'docker-container' }}
      - name: Build the image for amd64 with the local layer cache
        if: ${{ contains(vars.RUNNER_LABELS, 'self-hosted') }}
        timeout-minutes: 15
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: pagehall:operations-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: VERSION=ci
      - name: Build the image for amd64
        if: ${{ !contains(vars.RUNNER_LABELS, 'self-hosted') }}
        timeout-minutes: 15
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: pagehall:operations-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: VERSION=ci
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=image
          cache-to: type=gha,mode=max,scope=amd64
      - name: Build the image of the previous version
        if: steps.previous.outputs.build == 'true'
        timeout-minutes: 20
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.previous.outputs.path }}
          file: ${{ steps.previous.outputs.path }}/docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.previous.outputs.image }}
          build-args: VERSION=${{ steps.previous.outputs.sha }}
      - name: Pull the previous release
        if: steps.previous.outputs.build == 'false'
        env:
          IMAGE: ${{ steps.previous.outputs.image }}
        run: docker pull "$IMAGE"
      - name: Install the previous version and update with one command
        env:
          PREVIOUS: ${{ steps.previous.outputs.image }}
        run: scripts/install-update-check.sh "$PREVIOUS" pagehall:operations-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Check the reverse proxy examples
        run: scripts/reverse-proxy-check.sh pagehall:operations-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Check the storage service example of the backup documentation
        run: scripts/backup-network-check.sh pagehall:operations-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Remove the images of this job
        if: always()
        env:
          PREVIOUS: ${{ steps.previous.outputs.image }}
          PREVIOUS_PATH: ${{ steps.previous.outputs.path }}
        run: |
          docker image rm --force pagehall:operations-${{ github.run_id }}-${{ github.run_attempt }} "$PREVIOUS" || true
          if [ -n "$PREVIOUS_PATH" ]; then git worktree remove --force "$PREVIOUS_PATH" || rm -rf "$PREVIOUS_PATH"; fi

  e2e:
    name: End-to-end, accessibility and visual tests
    needs: scope
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || !contains(vars.RUNNER_LABELS, 'self-hosted')) && needs.scope.outputs.end-to-end == 'true'
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '"ubuntu-24.04"') }}
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf # v1.64.1-noble
      options: >-
        --user ${{ needs.scope.outputs.runner-user }}
        --tmpfs /pagehall-e2e
        ${{ contains(vars.RUNNER_LABELS, 'self-hosted') && format('--volume {0}:/ci-cache', vars.CI_CACHE_DIR || '/srv/ci-cache') || '' }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pagehall
          POSTGRES_PASSWORD: pagehall
          POSTGRES_DB: pagehall
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U pagehall -d pagehall"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
          --tmpfs /var/lib/postgresql/data
      mailpit:
        image: axllent/mailpit:v1.31.3
        env:
          MP_DISABLE_VERSION_CHECK: "true"
          MP_DATABASE: "file::memory:"
      valkey:
        image: valkey/valkey:8-alpine
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PAGEHALL_E2E_DATABASE_URL: postgres://pagehall:pagehall@postgres:5432/pagehall
      PAGEHALL_E2E_MAILPIT_URL: http://mailpit:8025
      PAGEHALL_E2E_REDIS_URL: redis://valkey:6379
      PAGEHALL_E2E_SMTP_HOST: mailpit
      PAGEHALL_E2E_STATE_DIR: /pagehall-e2e/state
      PAGEHALL_E2E_WORKERS: ${{ vars.E2E_WORKERS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record the load of the machine
        run: nohup node scripts/record-vm-load.ts record "$RUNNER_TEMP/vm-load.jsonl" > /dev/null 2>&1 &
      - name: Use the caches on the runner
        if: ${{ contains(vars.RUNNER_LABELS, 'self-hosted') }}
        run: node scripts/prepare-ci-cache.ts e2e /ci-cache
      - name: Enable pnpm for the runner user
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          corepack enable --install-directory "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Locate the pnpm store
        id: pnpm
        run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - if: ${{ !contains(vars.RUNNER_LABELS, 'self-hosted') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-store-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-playwright-
      - if: ${{ !contains(vars.RUNNER_LABELS, 'self-hosted') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-e2e-${{ github.sha }}
          restore-keys: turbo-e2e-
      - name: Install PostgreSQL client tools for the backup test
        run: scripts/install-postgres-client.sh "$RUNNER_TEMP/postgresql-client" 16 >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - name: Turn off durability in the test database
        run: node scripts/tune-test-postgres.ts "$PAGEHALL_E2E_DATABASE_URL"
      - run: pnpm build
      - run: pnpm --filter @pagehall/web build:e2e
      - name: Collect the test reports of this job
        run: |
          echo "PAGEHALL_TEST_REPORT_DIR=$GITHUB_WORKSPACE/.test-reports" >> "$GITHUB_ENV"
          echo "PAGEHALL_TEST_JOB=End-to-end tests" >> "$GITHUB_ENV"
      - run: pnpm --filter @pagehall/web test:e2e
        env:
          PAGEHALL_E2E_SWEEPS: ${{ needs.scope.outputs.sweeps }}
      - name: Show the load of the machine in the job summary
        if: always()
        run: node scripts/record-vm-load.ts summary "$RUNNER_TEMP/vm-load.jsonl" "the end-to-end tests"
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-e2e
          path: .test-reports
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
      - name: Keep the traces of failed attempts, also when the retry passed
        if: always() && hashFiles('apps/web/test-results/**/trace.zip') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failed-attempts
          path: |
            apps/web/test-results
            ${{ env.PAGEHALL_E2E_STATE_DIR }}/server.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Check that every file in the workspace and the caches belongs to the runner user
        if: always()
        env:
          CACHE: ${{ contains(vars.RUNNER_LABELS, 'self-hosted') && '/ci-cache' || '' }}
        run: node scripts/check-file-owners.ts "$GITHUB_WORKSPACE" ${CACHE:+"$CACHE"}

  identity-providers:
    name: Sign-in through identity providers
    needs: [scope, browsers-first]
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || !contains(vars.RUNNER_LABELS, 'self-hosted')) && needs.scope.outputs.identity-providers == 'true'
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '"ubuntu-24.04"') }}
    timeout-minutes: 30
    env:
      PAGEHALL_E2E_IDP: "1"
      PAGEHALL_E2E_HOST: 0.0.0.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Record the load of the machine
        run: nohup node scripts/record-vm-load.ts record "$RUNNER_TEMP/vm-load.jsonl" > /dev/null 2>&1 &
      - name: Use the caches on the runner
        if: ${{ contains(vars.RUNNER_LABELS, 'self-hosted') }}
        run: node scripts/prepare-ci-cache.ts host "$CI_CACHE_DIR"
      - run: corepack enable
      - name: Locate the pnpm store
        id: pnpm
        run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - if: ${{ !contains(vars.RUNNER_LABELS, 'self-hosted') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - name: Choose free ports for this job
        run: >-
          node scripts/pick-free-ports.ts POSTGRES_PORT MAILPIT_SMTP_PORT MAILPIT_PORT
          KEYCLOAK_PORT AUTHENTIK_PORT LDAP_PORT PAGEHALL_E2E_PORT:3
      - name: Name the compose project and point the tests at the chosen ports
        run: |
          {
            echo "COMPOSE_PROJECT_NAME=pagehall-idp-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "PAGEHALL_E2E_STATE_DIR=${RUNNER_TEMP}/pagehall-e2e-state"
            echo "PAGEHALL_E2E_DATABASE_URL=postgres://pagehall:pagehall@localhost:${POSTGRES_PORT}/pagehall"
            echo "PAGEHALL_E2E_MAILPIT_URL=http://localhost:${MAILPIT_PORT}"
            echo "PAGEHALL_E2E_SMTP_PORT=${MAILPIT_SMTP_PORT}"
            echo "PAGEHALL_E2E_KEYCLOAK_URL=http://keycloak.localhost:${KEYCLOAK_PORT}"
            echo "PAGEHALL_E2E_AUTHENTIK_URL=http://authentik.localhost:${AUTHENTIK_PORT}"
            echo "PAGEHALL_E2E_LDAP_URL=ldap://localhost:${LDAP_PORT}"
          } >> "$GITHUB_ENV"
      - name: Resolve the identity provider host names to this machine
        run: grep -q authentik.localhost /etc/hosts || echo "127.0.0.1 keycloak.localhost authentik.localhost" | sudo tee -a /etc/hosts
      - name: Start PostgreSQL, Mailpit, Keycloak, Authentik and OpenLDAP
        run: >-
          docker compose -f docker/compose.dev.yml -f docker/compose.ci.yml --profile idp up --detach --wait
          postgres mailpit keycloak authentik-postgres authentik-server authentik-worker openldap
      - name: Wait until Authentik has applied the test blueprint
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS "$PAGEHALL_E2E_AUTHENTIK_URL/application/o/pagehall/.well-known/openid-configuration" > /dev/null; then exit 0; fi
            sleep 5
          done
          docker compose -f docker/compose.dev.yml -f docker/compose.ci.yml --profile idp logs authentik-worker
          exit 1
      - name: Install PostgreSQL client tools for the backup test
        run: command -v pg_dump > /dev/null || (sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client)
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @pagehall/web build:e2e
      - if: ${{ !contains(vars.RUNNER_LABELS, 'self-hosted') }}
        run: pnpm --filter @pagehall/web exec playwright install --with-deps chromium
      - if: ${{ contains(vars.RUNNER_LABELS, 'self-hosted') }}
        run: pnpm --filter @pagehall/web exec playwright install chromium
      - name: Wait until Authentik shows its sign-in form in a browser
        run: pnpm --filter @pagehall/web exec node e2e/support/wait-for-authentik.ts
      - name: Collect the test reports of this job
        run: |
          echo "PAGEHALL_TEST_REPORT_DIR=$GITHUB_WORKSPACE/.test-reports" >> "$GITHUB_ENV"
          echo "PAGEHALL_TEST_JOB=Identity provider tests" >> "$GITHUB_ENV"
      - run: pnpm --filter @pagehall/web exec playwright test --project=idp
      - name: Show the load of the machine in the job summary
        if: always()
        run: node scripts/record-vm-load.ts summary "$RUNNER_TEMP/vm-load.jsonl" "the identity provider tests"
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-identity-providers
          path: .test-reports
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: identity-provider-report
          path: apps/web/playwright-report
          retention-days: 7
      - name: Keep the traces of failed attempts, also when the retry passed
        if: always() && hashFiles('apps/web/test-results/**/trace.zip') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: identity-provider-failed-attempts
          path: |
            apps/web/test-results
            ${{ env.PAGEHALL_E2E_STATE_DIR }}/server.log
          if-no-files-found: ignore
          retention-days: 7
      - if: failure()
        run: docker compose -f docker/compose.dev.yml -f docker/compose.ci.yml --profile idp logs keycloak authentik-server authentik-worker openldap
      - name: Show the Authentik logs in the job summary
        if: failure()
        run: |
          {
            echo "### Authentik logs (last 200 lines each)"
            for service in authentik-server authentik-worker; do
              echo "<details><summary>$service</summary>"
              echo
              echo '```'
              docker compose -f docker/compose.dev.yml -f docker/compose.ci.yml --profile idp logs --no-color --tail 200 "$service" 2>&1 | tail -c 20000
              echo '```'
              echo "</details>"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the containers, volumes and images of this job
        if: always()
        run: docker compose -f docker/compose.dev.yml -f docker/compose.ci.yml --profile idp down --volumes --remove-orphans --rmi local

  quick-checks:
    name: Quick checks
    needs: [scope, browsers-first]
    permissions:
      contents: read
      pull-requests: read
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || !contains(vars.RUNNER_LABELS, 'self-hosted'))
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '"ubuntu-24.04"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Check sign-off
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        run: node scripts/check-dco.ts "${BASE_SHA}..${HEAD_SHA}"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Compare the API description with the base branch
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/check-api-compatibility.ts "$BASE_SHA" --pr "$PR_NUMBER"
      - name: Use the caches on the runner
        if: ${{ !cancelled() && contains(vars.RUNNER_LABELS, 'self-hosted') }}
        run: node scripts/prepare-ci-cache.ts host "$CI_CACHE_DIR"
      - if: ${{ !cancelled() }}
        run: corepack enable
      - name: Locate the pnpm store
        if: ${{ !cancelled() }}
        id: pnpm
        run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - if: ${{ !cancelled() && !contains(vars.RUNNER_LABELS, 'self-hosted') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - if: ${{ !cancelled() }}
        run: pnpm install --frozen-lockfile
      - name: License check
        if: ${{ !cancelled() }}
        run: pnpm licenses:check
      - name: Dependency audit
        if: ${{ !cancelled() }}
        run: pnpm audit --audit-level=high

  flaky-tests:
    name: Flaky tests
    needs: [scope, unit, e2e, identity-providers]
    if: always() && needs.scope.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || !contains(vars.RUNNER_LABELS, 'self-hosted'))
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '"ubuntu-24.04"') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: test-reports-*
          path: .test-reports
      - name: List the flaky tests
        run: node scripts/flaky-summary.ts .test-reports flaky-tests.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flaky-tests
          path: flaky-tests.md
          retention-days: 30

  result:
    name: CI result
    needs: [scope, browsers-first, checks, unit, backup, operations, e2e, identity-providers, quick-checks]
    if: always()
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && contains(vars.RUNNER_LABELS, 'self-hosted')) && '"ubuntu-24.04"' || vars.RUNNER_LABELS || '"ubuntu-24.04"') }}
    timeout-minutes: 5
    steps:
      - name: Fail when a job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          SCOPE: ${{ needs.scope.result }}
        run: |
          if [ "$SCOPE" != "success" ]; then
            echo "::error title=CI did not run::The scope job ended as '$SCOPE'. Pull requests from forks do not run on self-hosted runners; run the checks in a branch of this repository."
            exit 1
          fi
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
