version: 1
metadata:
  name: Pagehall test setup
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - model: authentik_core.user
    id: user-alice
    identifiers:
      username: alice
    attrs:
      name: Alice Example
      email: alice@example.org
      password: pagehall-test-password
      is_active: true
  - model: authentik_core.user
    id: user-bob
    identifiers:
      username: bob
    attrs:
      name: Bob Example
      email: bob@example.org
      password: pagehall-test-password
      is_active: true
  - model: authentik_core.user
    id: user-carol
    identifiers:
      username: carol
    attrs:
      name: Carol Example
      email: carol@example.org
      password: pagehall-test-password
      is_active: true
  - model: authentik_core.user
    id: user-dave
    identifiers:
      username: dave
    attrs:
      name: Dave Example
      email: dave@example.org
      password: pagehall-test-password
      is_active: true
  - model: authentik_core.user
    id: user-erin
    identifiers:
      username: erin
    attrs:
      name: Erin Outside
      email: erin@example.net
      password: pagehall-test-password
      is_active: true
  - model: authentik_core.group
    id: group-engineering
    identifiers:
      name: engineering
    attrs:
      attributes:
        pagehall_test_group: engineering
      users:
        - !KeyOf user-alice
        - !KeyOf user-bob
        - !KeyOf user-dave
  - model: authentik_core.group
    id: group-admins
    identifiers:
      name: admins
    attrs:
      attributes:
        pagehall_test_group: admins
      users:
        - !KeyOf user-alice
  - model: authentik_providers_oauth2.scopemapping
    id: scope-profile
    identifiers:
      name: Pagehall profile
    attrs:
      name: Pagehall profile
      scope_name: profile
      description: Name and user name without groups
      expression: |
        return {
            "name": request.user.name,
            "given_name": request.user.name,
            "preferred_username": request.user.username,
            "nickname": request.user.username,
        }
  - model: authentik_providers_oauth2.scopemapping
    id: scope-groups
    identifiers:
      name: Pagehall groups
    attrs:
      name: Pagehall groups
      scope_name: groups
      description: Group IDs and names for Pagehall
      expression: |
        groups = list(request.user.ak_groups.all())
        return {
            "groups": [str(group.pk) for group in groups],
            "group_names": [group.name for group in groups],
        }
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-pagehall
    identifiers:
      name: Pagehall
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      grant_types:
        - authorization_code
        - refresh_token
      client_id: pagehall
      client_secret: pagehall-authentik-secret
      include_claims_in_id_token: true
      issuer_mode: per_provider
      sub_mode: hashed_user_id
      logout_method: backchannel
      logout_uri: !Env [PAGEHALL_AUTHENTIK_BACKCHANNEL_LOGOUT_URL, ""]
      redirect_uris:
        - matching_mode: regex
          url: 'http://(localhost|127\.0\.0\.1):(4310|5173|3000)/.*'
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !KeyOf scope-profile
        - !KeyOf scope-groups
  - model: authentik_core.application
    id: application-pagehall
    identifiers:
      slug: pagehall
    attrs:
      name: Pagehall
      provider: !KeyOf provider-pagehall
      policy_engine_mode: any
