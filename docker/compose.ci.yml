services:
  postgres:
    command:
      - postgres
      - -c
      - max_connections=400
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
    volumes: !reset []
    tmpfs:
      - /var/lib/postgresql/data

  authentik-postgres:
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
    tmpfs:
      - /var/lib/postgresql/data
