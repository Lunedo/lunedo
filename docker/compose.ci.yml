services:
  postgres:
    command:
      - postgres
      - -c
      - max_connections=400
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
    volumes: !reset []
    tmpfs:
      - /var/lib/postgresql/data

  authentik-server:
    mem_limit: 2g
    mem_reservation: 1g

  authentik-worker:
    mem_limit: 1g
    mem_reservation: 512m
