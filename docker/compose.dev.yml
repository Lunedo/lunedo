# Development environment: PostgreSQL and all Pagehall processes with hot reload.
# Start with `pnpm dev` from the repository root.
name: pagehall-dev

x-node-modules: &node-modules
  - ..:/repo
  - pnpm-store:/pnpm/store
  - node-modules-root:/repo/node_modules
  - node-modules-web:/repo/apps/web/node_modules
  - node-modules-api:/repo/apps/api/node_modules
  - node-modules-collab:/repo/apps/collab/node_modules
  - node-modules-worker:/repo/apps/worker/node_modules
  - node-modules-render:/repo/apps/render/node_modules
  - node-modules-editor-schema:/repo/packages/editor-schema/node_modules
  - node-modules-shared:/repo/packages/shared/node_modules
  - node-modules-ui:/repo/packages/ui/node_modules
  - node-modules-tokens:/repo/packages/tokens/node_modules
  - node-modules-config:/repo/packages/config/node_modules
  - node-modules-server:/repo/packages/server/node_modules
  - pagehall-data:/var/lib/pagehall

services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_connections=400"]
    environment:
      POSTGRES_USER: pagehall
      POSTGRES_PASSWORD: pagehall
      POSTGRES_DB: pagehall
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U pagehall -d pagehall"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:9-alpine
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.6
    environment:
      MP_DISABLE_VERSION_CHECK: "true"
      MP_DATABASE: "file::memory:"
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

  # S3-compatible object storage for the tests of the s3 file storage and the S3 backup target.
  s3:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    environment:
      AWS_ACCESS_KEY_ID: pagehall
      AWS_SECRET_ACCESS_KEY: pagehall-s3
    ports:
      - "127.0.0.1:${S3_PORT:-9100}:8333"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dev
    command: >-
      sh -c "pnpm install --frozen-lockfile --config.confirm-modules-purge=false
      && pnpm dev:apps"
    working_dir: /repo
    init: true
    # PAGEHALL_SHUTDOWN_TIMEOUT_SECONDS (30) plus the 10 second shutdown margin, with some room.
    stop_grace_period: 45s
    environment:
      PAGEHALL_DATABASE_URL: postgres://pagehall:pagehall@postgres:5432/pagehall
      PAGEHALL_LOG_LEVEL: debug
      PAGEHALL_INSECURE_IDENTITY_PROVIDERS: "true"
      # Optional: a fixed setup code instead of the link in the log, at least 12 characters.
      # PAGEHALL_SETUP_CODE: choose-a-long-setup-code
      PAGEHALL_DEV_HOST: 0.0.0.0
      PAGEHALL_DEV_POLLING: "true"
      PAGEHALL_DEV_API_URL: http://localhost:3000
      PAGEHALL_REDIS_URL: redis://valkey:6379
      # Optional: a public HTTPS address in front of the Vite dev server, for example a tunnel.
      PAGEHALL_INSTANCE_URL: ${PAGEHALL_INSTANCE_URL:-}
      # Only the Vite dev proxy in this container forwards the client's address and protocol.
      PAGEHALL_TRUSTED_PROXIES: 127.0.0.1,::1
      PAGEHALL_UPDATE_CHECK: "false"
      # Optional: PDF on the server through the render container of the profile "render".
      # Set both to use it, for example PAGEHALL_RENDER_URL=http://render:3000.
      PAGEHALL_RENDER_URL: ${PAGEHALL_RENDER_URL:-}
      PAGEHALL_RENDER_TOKEN: ${PAGEHALL_RENDER_TOKEN:-}
      # Optional: a folder for exports larger than the upload limit. Add a read-only mount
      # such as "./import:/data/import:ro" to the volumes of this service. Each organization
      # reads only its own subfolder, named after its ID, for example ./import/<organization ID>.
      # PAGEHALL_IMPORT_DIR: /data/import
      TURBO_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
    ports:
      - "127.0.0.1:5173:5173"
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3001:3001"
      - "127.0.0.1:3002:3002"
    volumes: *node-modules
    extra_hosts:
      - "keycloak.localhost:host-gateway"
      - "authentik.localhost:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "docker/dev-healthcheck.ts"]
      interval: 10s
      timeout: 10s
      start_period: 180s
      retries: 3

  # Optional render container for PDF on the server, started with the profile "render".
  # It needs the same token as PAGEHALL_RENDER_TOKEN of the app, at least 32 characters.
  render:
    profiles: [render]
    build:
      context: ..
      dockerfile: docker/render.Dockerfile
    environment:
      RENDER_TOKEN: ${PAGEHALL_RENDER_TOKEN:-}
      RENDER_CONCURRENCY: ${RENDER_CONCURRENCY:-2}
      # Docker Desktop does not give containers the user namespaces Chromium's sandbox needs, so development
      # runs without it and the container logs a warning. Production setups keep the sandbox on.
      RENDER_CHROMIUM_SANDBOX: ${RENDER_CHROMIUM_SANDBOX:-false}
    ports:
      - "127.0.0.1:${RENDER_PORT:-3003}:3000"

  # Identity providers for development and tests, started with the profile "idp".
  # Browsers and Pagehall reach them under the same *.localhost address, so issuers match.
  keycloak:
    profiles: [idp]
    image: quay.io/keycloak/keycloak:26.8.1@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HOSTNAME: http://keycloak.localhost:${KEYCLOAK_PORT:-8080}
      PAGEHALL_E2E_PORT: ${PAGEHALL_E2E_PORT:-4310}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      PAGEHALL_KEYCLOAK_BACKCHANNEL_LOGOUT_URL: ${PAGEHALL_KEYCLOAK_BACKCHANNEL_LOGOUT_URL:-}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./idp/keycloak:/opt/keycloak/data/import:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 30

  openldap:
    profiles: [idp]
    build: ./idp/openldap
    ports:
      - "127.0.0.1:${LDAP_PORT:-3389}:389"

  authentik-postgres:
    profiles: [idp]
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: authentik
      POSTGRES_DB: authentik
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U authentik -d authentik"]
      interval: 5s
      timeout: 3s
      retries: 20

  authentik-server:
    profiles: [idp]
    image: ghcr.io/goauthentik/server:2026.8.4@sha256:e7226ae116dac5aa0a5643803e735b010038f492c401e08e16b3bf1ac54c090c
    command: server
    environment: &authentik-environment
      AUTHENTIK_SECRET_KEY: pagehall-development-only-secret-key-not-for-production
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik
      AUTHENTIK_BOOTSTRAP_PASSWORD: admin
      AUTHENTIK_BOOTSTRAP_TOKEN: pagehall-authentik-api-token
      AUTHENTIK_BOOTSTRAP_EMAIL: admin@example.org
      AUTHENTIK_LOG_LEVEL: warning
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
      PAGEHALL_AUTHENTIK_BACKCHANNEL_LOGOUT_URL: ${PAGEHALL_AUTHENTIK_BACKCHANNEL_LOGOUT_URL:-}
    ports:
      - "127.0.0.1:${AUTHENTIK_PORT:-9000}:9000"
    volumes:
      - ./idp/authentik:/blueprints/custom:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      authentik-postgres:
        condition: service_healthy

  authentik-worker:
    profiles: [idp]
    image: ghcr.io/goauthentik/server:2026.8.4@sha256:e7226ae116dac5aa0a5643803e735b010038f492c401e08e16b3bf1ac54c090c
    command: worker
    environment: *authentik-environment
    volumes:
      - ./idp/authentik:/blueprints/custom:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      authentik-postgres:
        condition: service_healthy

volumes:
  postgres-data:
  s3-data:
  pnpm-store:
  node-modules-root:
  node-modules-web:
  node-modules-api:
  node-modules-collab:
  node-modules-worker:
  node-modules-render:
  node-modules-editor-schema:
  node-modules-shared:
  node-modules-ui:
  node-modules-tokens:
  node-modules-config:
  node-modules-server:
  pagehall-data:
